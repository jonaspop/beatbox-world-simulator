<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beatbox World Simulator</title>
  <meta name="description" content="Simulate the beatbox scene season by season: national championships, GBB qualifiers, GBB and BBWC.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#home" aria-label="Beatbox World Simulator home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15"/><rect x="12" y="6" width="8" height="13" rx="4"/><path d="M9 15a7 7 0 0 0 14 0" fill="none" stroke-width="2.4"/><path d="M16 22v4M12 26h8" stroke-width="2.4"/></svg>
      <span>Beatbox World <b>Sim</b></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#home">Home</a><a href="#calendar">Calendar</a><a href="#people">Beatboxers</a>
      <a href="#champions">Champions</a><a href="#countries">Countries</a><a href="#custom">Custom</a><a href="#settings">Settings</a>
    </nav>
    <div class="top-ctl">
      <div class="status" id="status" aria-live="polite"></div>
      <button class="btn primary" data-act="next" title="Simulate the next event on the calendar">Next ▸</button>
    </div>
  </header>
  <main id="main" class="wrap"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
